---
- name: depoly new hosts
  hosts: proxy
  remote_user: tailien
  become: true
  vars:
    USER: readmi
  vars_files:
    - secret.txt
  tasks:
    - name: create user
      ansible.builtin.user:
        name: "{{ USER }}"
        state: present
        groups: wheel
        password: "{{ readmi_PW|password_hash('sha512') }}"
